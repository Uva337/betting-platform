<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Live Betting Platform</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1e1e1e; color: #fff; margin: 0; padding: 20px; }
        .cabinet { background-color: #2c2c2c; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: inline-block; }
        .odds-box { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
        .team { padding: 20px; background-color: #333; border-radius: 10px; width: 250px; }
        .odds { font-size: 42px; font-weight: bold; color: #00ffcc; transition: color 0.2s; margin: 10px 0; }
        input, button { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; }
        button { background-color: #00ffcc; color: #000; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #00ccaa; }
        .bet-btn { width: 100%; background-color: #ffaa00; margin-top: 10px; }
        .bet-btn:hover { background-color: #cc8800; }
    </style>
</head>
<body>
    <div class="cabinet">
        <h2>👤 Личный кабинет (ID: 1)</h2>
        <h3>Баланс: <span id="balance">0</span> 💰</h3>
        <button onclick="updateBalance()">🔄 Обновить баланс</button>
    </div>

    <br>
    <input type="number" id="matchId" placeholder="ID матча из логов">
    <button onclick="connect()">📺 Подключиться к трансляции</button>

    <div class="odds-box" id="oddsContainer" style="display: none;">
        <div class="team">
            <h3>Team A</h3>
            <div class="odds" id="teamAOdds">-</div>
            <input type="number" id="amountA" placeholder="Сумма ставки" style="width: 80%;">
            <button class="bet-btn" onclick="placeBet('Team A', 'teamAOdds', 'amountA')">СДЕЛАТЬ СТАВКУ</button>
        </div>
        <div class="team">
            <h3>Team B</h3>
            <div class="odds" id="teamBOdds">-</div>
            <input type="number" id="amountB" placeholder="Сумма ставки" style="width: 80%;">
            <button class="bet-btn" onclick="placeBet('Team B', 'teamBOdds', 'amountB')">СДЕЛАТЬ СТАВКУ</button>
        </div>
    </div>

    <script>
        const USER_ID = 1; // Играем за тестового юзера
        let ws;

        // Получение баланса с бэкенда
        async function updateBalance() {
            try {
                const response = await fetch(`http://localhost:8081/api/v1/users/${USER_ID}/balance`);
                const data = await response.json();
                // Подстрой data.balance под то, как отвечает твой API
                document.getElementById('balance').innerText = data.balance || data.data.balance; 
            } catch (e) {
                console.error("Ошибка получения баланса", e);
            }
        }

        // Подключение к WebSockets (осталось без изменений)
        function connect() {
            const matchId = document.getElementById('matchId').value;
            if (!matchId) return alert("Введите ID матча!");
            if (ws) ws.close();
            
            ws = new WebSocket(`ws://localhost:8081/api/v1/matches/${matchId}/ws`);
            ws.onopen = () => document.getElementById('oddsContainer').style.display = 'flex';
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                animateOdds('teamAOdds', data.team_a);
                animateOdds('teamBOdds', data.team_b);
            };
            updateBalance(); // Обновляем баланс при старте матча
        }

        function animateOdds(elementId, newValue) {
            const el = document.getElementById(elementId);
            const formattedValue = newValue.toFixed(2);
            if (el.innerText !== formattedValue) {
                el.innerText = formattedValue;
                el.style.color = "#ffffff";
                setTimeout(() => el.style.color = "#00ffcc", 150);
            }
        }

        // Отправка ставки на бэкенд
        async function placeBet(team, oddsElementId, amountElementId) {
            const matchId = parseInt(document.getElementById('matchId').value);
            const amount = parseFloat(document.getElementById(amountElementId).value);
            const odds = parseFloat(document.getElementById(oddsElementId).innerText);

            if (!amount || amount <= 0) return alert("Введите корректную сумму ставки!");

            const payload = {
                user_id: USER_ID,
                match_id: matchId,
                team: team,
                amount: amount,
                odds: odds
            };

            try {
                const response = await fetch(`http://localhost:8081/api/v1/bets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(`✅ Ставка на ${team} успешно принята!`);
                    updateBalance(); // Сразу списываем деньги с экрана
                } else {
                    const errData = await response.json();
                    alert(`❌ Ошибка ставки: ${JSON.stringify(errData)}`);
                }
            } catch (e) {
                alert("Ошибка соединения с сервером");
            }
        }

        // Грузим баланс при открытии страницы
        window.onload = updateBalance;
    </script>
</body>
</html>
